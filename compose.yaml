# Local document API and PostgreSQL.
# POSTGRES_PASSWORD fallback is for one-command local development only.
# Set POSTGRES_PASSWORD in a gitignored .env file to override it.
services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: dev
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgres://appuser:${POSTGRES_PASSWORD:-devonly}@db:5432/securecloud
    volumes:
      - ./apps/api/src:/app/src
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3000/health/ready").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    develop:
      watch:
        - action: sync
          path: ./apps/api/src
          target: /app/src
        - action: rebuild
          path: ./apps/api/package.json
        - action: rebuild
          path: ./apps/api/package-lock.json

  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devonly}
      POSTGRES_DB: securecloud
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d securecloud"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  db-data:
